
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login dan Registrasi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #087f5b;
            padding: 15px;
        }

        .kotak {
            background: #c9e4d8;
            width: 100%;
            max-width: 350px;
            padding: 20px 28px;
            margin: 15px auto 20px;
        }

        h2 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 6px;
            border: 1px solid #ccc;
            background: white;
        }

        button {
            width: 100%;
            padding: 9px;
            background: #399b60;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #267a48;
        }

        p {
            font-size: 14px;
        }

        a {
            color: #71977e;
        }

        .lupa {
            margin: 8px 0;
        }
    </style>
</head>

<body>

    <!-- FORM LOGIN -->
    <div class="kotak">
        <h2>Form Login</h2>

        <form>
            <input type="email" placeholder="Masukkan email" required>
            <input type="password" placeholder="Masukkan password" required>

            <p class="lupa">
                <a href="#">Lupa Password?</a>
            </p>

            <button type="submit">Login</button>
        </form>

        <p>Belum punya akun? <a href="#registrasi">Daftar</a></p>
    </div>

    <!-- FORM REGISTRASI -->
    <div class="kotak" id="registrasi">
        <h2>Form Registrasi</h2>

        <form>
            <input type="email" placeholder="Masukkan email" required>
            <input type="password" placeholder="Masukkan password" required>
            <input type="password" placeholder="Masukkan ulang password" required>

            <button type="submit">Daftar</button>
        </form>

        <p>Sudah punya akun? <a href="#">Login</a></p>
    </div>

</body>
</html>
